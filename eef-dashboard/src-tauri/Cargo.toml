[package]
name = "eef-dashboard"
version = "0.2.0"
description = "EEF Dashboard"
authors = ["EEF"]
edition = "2021"

# See https://tauri.app/v1/api/config#build for more information
[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde_json = "1"
serde = { version = "1", features = ["derive"] }
tauri = { version = "2", features = [] }

# TODO(spike): wire up real update flow in the next phase.
# This is the Tauri v2 replacement for `electron-updater`; it provides the
# `check()`/`download_and_install()` Rust API and a matching JS `check()`
# call from `@tauri-apps/plugin-updater`, mirroring the IPC surface the
# Electron preload exposed as `updater:get-version` / `updater:check` /
# `updater:install`.
# tauri-plugin-updater = "2"
# tauri-plugin-process = "2"   # needed for relaunch after install (quitAndInstall equivalent)

[lib]
name = "eef_dashboard_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "eef-dashboard"
path = "src/main.rs"
