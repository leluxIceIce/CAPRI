[package]
name = "eef-dashboard"
version = "0.2.0"
description = "CAPRI — a state-discovery framework for ocean colour"
authors = ["leluxIceIce and CAPRI contributors"]
license = "Apache-2.0"
edition = "2021"

# See https://tauri.app/v1/api/config#build for more information
[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde_json = "1"
serde = { version = "1", features = ["derive"] }
tauri = { version = "2", features = [] }

# Persisted key-value store (a real JSON file in the app-data dir). Backs the
# Embedders tab so user-created embedders + their training data survive a
# restart. Registered in main.rs and granted via capabilities/default.json.
tauri-plugin-store = "2"

# TODO(next phase): not yet registered in src/lib.rs / src/main.rs via
# `.plugin(tauri_plugin_updater::Builder::new().build())` /
# `.plugin(tauri_plugin_process::init())`, and `tauri.conf.json` has no
# `plugins.updater` block yet (needs a real signing pubkey from
# `cargo tauri signer generate` first). This is the Tauri v2 replacement for
# `electron-updater`; it provides the `check()`/`download_and_install()` Rust
# API and a matching JS `check()` call from `@tauri-apps/plugin-updater`,
# mirroring the IPC surface the Electron preload exposed as
# `updater:get-version` / `updater:check` / `updater:install`. Full mapping
# of Electron IPC -> Tauri equivalents is documented in MIGRATION_NOTES.md.
tauri-plugin-updater = "2"
tauri-plugin-process = "2"   # needed for relaunch after install (quitAndInstall equivalent)

[lib]
name = "eef_dashboard_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "eef-dashboard"
path = "src/main.rs"
