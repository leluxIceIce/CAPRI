name: Web CI

# Safety net (design/TURBULENCE_IMPLEMENTATION_PLAN.md): typecheck, test and build
# every web app on every PR and on main, so refactors land against a green wall.
# The macOS .dmg packaging stays in macos-beta.yml — this workflow is Linux-only.
#
# Matrix over each standalone web app (they keep their own lockfile / npm ci, the
# M1 "standalone sibling" pattern; all consume packages/core via a path alias).

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: web-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app:
          - eef-dashboard   # legacy dashboard → the "clean room" fallback shell
          - apps/turbulence # the platform shell (M2+)
    defaults:
      run:
        working-directory: ${{ matrix.app }}
    env:
      # electron (eef-dashboard devDep) ships a ~100MB binary that's useless for
      # typecheck/test/build; skipping it is a no-op for apps that don't use it.
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ${{ matrix.app }}/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck (tsc --noEmit)
        run: npm run lint

      - name: Unit tests (vitest)
        run: npm test

      - name: Production build (vite)
        run: npm run build
